name: Comprehensive Unit & Integration Tests

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'claude/**'
    paths:
      - 'src/**'
      - 'spec/**'
      - 'shard.yml'
      - '.github/workflows/comprehensive-tests.yml'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run comprehensive tests nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      crystal_version:
        description: 'Crystal version to test'
        required: false
        default: '1.14.0'
        type: string
      run_all_components:
        description: 'Test all components individually'
        required: false
        default: 'true'
        type: boolean

env:
  CRYSTAL_VERSION: ${{ github.event.inputs.crystal_version || '1.14.0' }}

# Least-privilege token by default; jobs that write declare their own permissions.
permissions:
  contents: read

# Trace every command so CI logs show exactly what ran and what it printed.
# pipefail keeps a failing command visible when its output is piped to tee.
defaults:
  run:
    shell: bash -ex -o pipefail {0}

jobs:
  # Matrix test for different Crystal versions
  version-matrix:
    name: Crystal ${{ matrix.crystal }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        crystal: ['1.12.0', '1.13.0', '1.14.0']
        exclude:
          # Skip older versions on macOS for faster CI
          - os: macos-latest
            crystal: '1.12.0'
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ matrix.crystal }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev librocksdb-dev libevent-dev libssl-dev libgmp-dev libyaml-dev libpcre2-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install sqlite3 rocksdb libevent openssl gmp libyaml pcre2
        # Homebrew libraries are not on the default linker path on Apple Silicon
        echo "LIBRARY_PATH=$(brew --prefix)/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: shards install --verbose

    - name: Run tests
      run: crystal spec --stats -v --error-trace

  # Component-specific unit tests
  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Crystal
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/crystal
          ~/.local/share/crystal
          lib
        key: crystal-${{ env.CRYSTAL_VERSION }}-${{ hashFiles('shard.yml', 'shard.lock') }}
        restore-keys: |
          crystal-${{ env.CRYSTAL_VERSION }}-

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          librocksdb-dev \
          libevent-dev \
          libssl-dev \
          libgmp-dev \
          libyaml-dev \
          libpcre2-dev

    - name: Install dependencies
      run: shards install --verbose

    - name: Test CogUtil Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing CogUtil Component ==="
        crystal spec --stats -v spec/cogutil/ --error-trace --verbose

    - name: Test AtomSpace Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing AtomSpace Component ==="
        crystal spec --stats -v spec/atomspace/ --error-trace --verbose

    - name: Test PLN Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing PLN Component ==="
        crystal spec --stats -v spec/pln/ --error-trace --verbose

    - name: Test URE Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing URE Component ==="
        crystal spec --stats -v spec/ure/ --error-trace --verbose

    - name: Test OpenCog Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing OpenCog Component ==="
        crystal spec --stats -v spec/opencog/ --error-trace --verbose

    - name: Test MOSES Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing MOSES Component ==="
        crystal spec --stats -v spec/moses/ --error-trace --verbose

    - name: Test Attention Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing Attention Component ==="
        crystal spec --stats -v spec/attention/ --error-trace --verbose

    - name: Test NLP Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing NLP Component ==="
        crystal spec --stats -v spec/nlp/ --error-trace --verbose

    - name: Test Pattern Matching Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing Pattern Matching Component ==="
        crystal spec --stats -v spec/pattern_matching/ --error-trace --verbose

    - name: Test Pattern Mining Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing Pattern Mining Component ==="
        crystal spec --stats -v spec/pattern_mining/ --error-trace --verbose

    - name: Test CogServer Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing CogServer Component ==="
        crystal spec --stats -v spec/cogserver/ --error-trace --verbose

    - name: Test Agent-Zero Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing Agent-Zero Component ==="
        crystal spec --stats -v spec/agent-zero/ --error-trace --verbose

    - name: Test Spatial Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing Spatial Component ==="
        crystal spec --stats -v spec/spatial/ --error-trace --verbose

    - name: Test Temporal Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing Temporal Component ==="
        crystal spec --stats -v spec/temporal/ --error-trace --verbose

    - name: Test Behavior Component
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing Behavior Component ==="
        crystal spec --stats -v spec/behavior/ --error-trace --verbose

    - name: Test Performance Suite
      if: ${{ !cancelled() }}
      run: |
        echo "=== Testing Performance Suite ==="
        crystal spec --stats -v spec/performance/ --error-trace --verbose

    - name: Generate test summary
      run: |
        echo "## Component Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        for comp in cogutil atomspace pln ure opencog moses attention nlp pattern_matching pattern_mining cogserver agent-zero spatial temporal behavior performance; do
          if [ -d "spec/$comp" ]; then
            count=$(find spec/$comp -name "*_spec.cr" 2>/dev/null | wc -l)
            echo "| $comp | $count spec files |" >> $GITHUB_STEP_SUMMARY
          fi
        done

  # Full test suite with coverage
  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          librocksdb-dev \
          libevent-dev \
          libssl-dev \
          libgmp-dev \
          libyaml-dev \
          libpcre2-dev

    - name: Install dependencies
      run: shards install --verbose

    - name: Run full test suite
      run: |
        echo "Running full test suite..."
        # Keep the summary even when specs fail, then return the real status.
        set +e
        crystal spec --stats -v --error-trace --junit_output=test-results.xml 2>&1 | tee test-output.log
        statuses=("${PIPESTATUS[@]}")
        set -e
        spec_status=${statuses[0]}
        tee_status=${statuses[1]}

        # Extract summary
        echo "=== Test Summary ===" >> test-summary.txt
        grep -E "^(Finished|[0-9]+ examples)" test-output.log >> test-summary.txt || true
        echo "crystal spec exit status: $spec_status" >> test-summary.txt
        if [ "$spec_status" -ne 0 ]; then
          echo "::error::Full test suite failed with exit status $spec_status"
          exit "$spec_status"
        fi
        if [ "$tee_status" -ne 0 ]; then
          echo "::error::Could not write test-output.log (tee exit status $tee_status)"
          exit "$tee_status"
        fi

    - name: Parse test results
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f test-results.xml ]; then
          # Extract test counts from JUnit XML
          # First exact attribute only; no pipe that pipefail could turn into extra output.
          junit_count() {
            awk -v key="$1" 'match($0, "[[:space:]]" key "=\"[^\"]*\"") { print substr($0, RSTART + length(key) + 3, RLENGTH - length(key) - 4); exit }' test-results.xml
          }
          tests=$(junit_count tests); tests=${tests:-N/A}
          failures=$(junit_count failures); failures=${failures:-N/A}
          errors=$(junit_count errors); errors=${errors:-N/A}
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | $tests |" >> $GITHUB_STEP_SUMMARY
          echo "| Failures | $failures |" >> $GITHUB_STEP_SUMMARY
          echo "| Errors | $errors |" >> $GITHUB_STEP_SUMMARY
        else
          echo "No test results XML generated" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test-results.xml
          test-output.log
          test-summary.txt
        retention-days: 14

  # Integration tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: component-tests
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev librocksdb-dev libevent-dev libssl-dev libgmp-dev libyaml-dev libpcre2-dev

    - name: Install dependencies
      run: shards install --verbose

    - name: Run integration tests
      if: ${{ !cancelled() }}
      run: |
        echo "Running integration tests..."
        crystal spec --stats -v spec/integration/ --error-trace --verbose

    - name: Run cross-component tests
      if: ${{ !cancelled() }}
      run: |
        echo "Testing cross-component functionality..."
        crystal spec --stats -v spec/crystalcog_spec.cr --error-trace --verbose

    - name: Run spec_helper integration
      if: ${{ !cancelled() }}
      run: |
        echo "Testing main spec_helper integration..."
        crystal spec --stats -v spec/spec_helper.cr --error-trace --verbose

  # Binary build verification
  binary-build-test:
    name: Binary Build Verification
    runs-on: ubuntu-latest
    needs: full-test-suite
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev librocksdb-dev libevent-dev libssl-dev libgmp-dev libyaml-dev libpcre2-dev

    - name: Install dependencies
      run: shards install --verbose

    - name: Build all binaries
      run: |
        mkdir -p bin
        echo "Building all defined binaries..."

        declare -A TARGETS=(
          ["crystalcog"]="src/bin/crystalcog.cr"
          ["cogutil"]="src/cogutil/cogutil.cr"
          ["atomspace"]="src/atomspace/atomspace.cr"
          ["atomspace_main"]="src/atomspace/atomspace_main.cr"
          ["opencog"]="src/opencog/opencog.cr"
          ["pln"]="src/pln/pln.cr"
          ["ure"]="src/ure/ure.cr"
          ["moses"]="src/moses/moses.cr"
          ["moses_main"]="src/moses/moses_main.cr"
          ["attention"]="src/attention/attention.cr"
          ["attention_main"]="src/attention/attention_main.cr"
          ["learning"]="src/learning/learning_main.cr"
          ["ml"]="src/ml/ml_main.cr"
          ["ai_bridge"]="src/ai_integration/ai_bridge.cr"
          ["pattern_matching"]="src/pattern_matching/pattern_matching_main.cr"
          ["pattern_mining"]="src/pattern_mining/pattern_mining_main.cr"
          ["nlp"]="src/nlp/nlp_main.cr"
          ["cogserver"]="src/bin/cogserver.cr"
          ["distributed_network_demo"]="src/agent-zero/distributed_network_demo.cr"
          ["agent_zero"]="src/agent-zero/agent_zero_main.cr"
          ["spatial"]="src/spatial/spatial.cr"
          ["temporal"]="src/temporal/temporal.cr"
          ["behavior"]="src/behavior/behavior.cr"
        )

        SUCCESS_COUNT=0
        FAIL_COUNT=0

        for target in "${!TARGETS[@]}"; do
          source="${TARGETS[$target]}"
          echo "Building $target from $source..."
          if [ -f "$source" ]; then
            if crystal build --verbose --stats --error-trace "$source" -o "bin/$target" 2>&1; then
              echo "  ✓ $target built successfully"
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              echo "  ✗ $target build failed"
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          else
            echo "  ⚠ Source file $source not found"
            FAIL_COUNT=$((FAIL_COUNT + 1))
          fi
        done

        echo ""
        echo "=== Build Summary ==="
        echo "Successful: $SUCCESS_COUNT"
        echo "Failed: $FAIL_COUNT"
        echo ""
        echo "Built binaries:"
        ls -lh bin/ 2>/dev/null || echo "No binaries in bin/"
        if [ "$FAIL_COUNT" -ne 0 ]; then
          echo "::error::$FAIL_COUNT binary target(s) failed to build or were missing"
          exit 1
        fi

    - name: Verify binaries
      run: |
        echo "Verifying built binaries..."
        for bin in bin/*; do
          if [ -f "$bin" ] && [ -x "$bin" ]; then
            echo "  ✓ $bin is executable"
            file "$bin"
          fi
        done

    - name: Upload built binaries
      uses: actions/upload-artifact@v4
      with:
        name: test-binaries
        path: bin/
        retention-days: 7

  # Final status
  test-status:
    name: Test Suite Status
    runs-on: ubuntu-latest
    needs: [version-matrix, component-tests, full-test-suite, integration-tests, binary-build-test]
    if: always()

    steps:
    - name: Check overall status
      run: |
        echo "## Comprehensive Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Version Matrix | ${{ needs.version-matrix.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Component Tests | ${{ needs.component-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Full Test Suite | ${{ needs.full-test-suite.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Binary Build | ${{ needs.binary-build-test.result }} |" >> $GITHUB_STEP_SUMMARY

        # Every required job must succeed; skipped, cancelled or failed is not a pass.
        failed=0
        for result in "${{ needs.version-matrix.result }}" "${{ needs.component-tests.result }}" "${{ needs.full-test-suite.result }}" "${{ needs.integration-tests.result }}" "${{ needs.binary-build-test.result }}"; do
          if [ "$result" != "success" ]; then
            failed=1
          fi
        done
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "$failed" -ne 0 ]; then
          echo "**Status: Tests require attention**" >> $GITHUB_STEP_SUMMARY
          echo "::error::One or more required test jobs did not succeed"
          exit 1
        fi
        echo "**Status: All tests passed**" >> $GITHUB_STEP_SUMMARY
