name: Release All Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: 'false'
        type: boolean
      build_static:
        description: 'Build static binaries (Linux only)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

env:
  CRYSTAL_VERSION: '1.14.0'
  # 1.14 has no official Linux aarch64 release asset/image.
  CRYSTAL_ARM64_VERSION: '1.22.0'
  CRYSTAL_WORKERS: '1'

# Define all binaries to build
# This list matches shard.yml targets
# Trace every command so CI logs show exactly what ran and what it printed.
defaults:
  run:
    shell: bash -ex {0}

jobs:
  # Build matrix for all binaries on Linux x86_64
  build-linux-x64:
    name: Build Linux x86_64 Binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache Crystal
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/crystal
          lib
        key: crystal-release-${{ runner.os }}-${{ runner.arch }}-${{ env.CRYSTAL_VERSION }}-${{ hashFiles('shard.yml', 'shard.lock') }}

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsqlite3-dev \
          librocksdb-dev \
          libpq-dev \
          libevent-dev \
          libssl-dev \
          libgmp-dev \
          libyaml-dev \
          libpcre2-dev \
          musl-tools \
          musl-dev

    - name: Install dependencies
      run: shards install --frozen --production

    - name: Build all declared binaries
      env:
        RELEASE_BUILD_STATIC: ${{ github.event_name == 'workflow_dispatch' && inputs.build_static || false }}
      run: bash scripts/release/build-binaries.sh dist/linux-x64

    - name: Create tarball
      run: |
        cd dist
        tar -czvf crystalcog-linux-x86_64.tar.gz linux-x64/
        sha256sum crystalcog-linux-x86_64.tar.gz > crystalcog-linux-x86_64.tar.gz.sha256

    - name: Upload Linux x64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crystalcog-linux-x86_64
        path: |
          dist/crystalcog-linux-x86_64.tar.gz
          dist/crystalcog-linux-x86_64.tar.gz.sha256
        retention-days: 30

  # Native ARM64 runner; Crystal 1.14's Alpine image is x86-only.
  build-linux-arm64:
    name: Build Linux ARM64 Binaries
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install native ARM64 Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_ARM64_VERSION }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev librocksdb-dev libpq-dev libevent-dev libssl-dev libgmp-dev libyaml-dev libpcre2-dev

    - name: Install exact locked dependencies
      run: shards install --frozen --production

    - name: Build all declared ARM64 binaries
      run: bash scripts/release/build-binaries.sh dist/linux-arm64

    - name: Create ARM64 tarball
      run: |
        cd dist
        tar -czvf crystalcog-linux-arm64.tar.gz linux-arm64/
        sha256sum crystalcog-linux-arm64.tar.gz > crystalcog-linux-arm64.tar.gz.sha256

    - name: Upload Linux ARM64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crystalcog-linux-arm64
        path: |
          dist/crystalcog-linux-arm64.tar.gz
          dist/crystalcog-linux-arm64.tar.gz.sha256
        retention-days: 30

  # Build for macOS x86_64
  build-macos-x64:
    name: Build macOS x86_64 Binaries
    runs-on: macos-15-intel  # Intel Mac
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Install system dependencies
      run: |
        brew install sqlite3 rocksdb libevent openssl@3 gmp libyaml pcre2
        echo "LIBRARY_PATH=$(brew --prefix)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: shards install --frozen --production

    - name: Build all declared binaries
      run: bash scripts/release/build-binaries.sh dist/macos-x64

    - name: Create tarball
      run: |
        cd dist
        tar -czvf crystalcog-macos-x86_64.tar.gz macos-x64/
        shasum -a 256 crystalcog-macos-x86_64.tar.gz > crystalcog-macos-x86_64.tar.gz.sha256

    - name: Upload macOS x64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crystalcog-macos-x86_64
        path: |
          dist/crystalcog-macos-x86_64.tar.gz
          dist/crystalcog-macos-x86_64.tar.gz.sha256
        retention-days: 30

  # Build for macOS ARM64 (Apple Silicon)
  build-macos-arm64:
    name: Build macOS ARM64 Binaries
    runs-on: macos-14  # Apple Silicon
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Install system dependencies
      run: |
        brew install sqlite3 rocksdb libevent openssl@3 gmp libyaml pcre2
        echo "LIBRARY_PATH=$(brew --prefix)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: shards install --frozen --production

    - name: Build all declared binaries
      run: bash scripts/release/build-binaries.sh dist/macos-arm64

    - name: Create tarball
      run: |
        cd dist
        tar -czvf crystalcog-macos-arm64.tar.gz macos-arm64/
        shasum -a 256 crystalcog-macos-arm64.tar.gz > crystalcog-macos-arm64.tar.gz.sha256

    - name: Upload macOS ARM64 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: crystalcog-macos-arm64
        path: |
          dist/crystalcog-macos-arm64.tar.gz
          dist/crystalcog-macos-arm64.tar.gz.sha256
        retention-days: 30

  # Create Docker images
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-linux-x64]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download Linux x64 artifacts
      uses: actions/download-artifact@v4
      with:
        name: crystalcog-linux-x86_64
        path: dist/

    - name: Extract binaries for Docker
      run: |
        cd dist
        tar -xzvf crystalcog-linux-x86_64.tar.gz

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Release version: $VERSION"

    - name: Create production Dockerfile
      run: |
        cat > Dockerfile.release << 'EOF'
        FROM ubuntu:24.04

        RUN apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates curl libsqlite3-0 librocksdb8.9 libpq5 \
            libevent-2.1-7t64 libevent-pthreads-2.1-7t64 libssl3t64 \
            libgcc-s1 libstdc++6 libgmp10 libyaml-0-2 libpcre2-8-0 libgc1 \
            && rm -rf /var/lib/apt/lists/* \
            && useradd -m -u 10001 crystalcog

        WORKDIR /app

        # Copy all binaries
        COPY dist/linux-x64/ /app/bin/

        # Make all binaries executable
        RUN find /app/bin -type f ! -name BUILD-MANIFEST.txt -exec chmod +x {} \;
        RUN /app/bin/crystalcog --version

        # Add to PATH
        ENV PATH="/app/bin:$PATH"

        USER crystalcog

        EXPOSE 18080

        ENTRYPOINT ["crystalcog"]
        EOF

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.release
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
          ghcr.io/${{ github.repository }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create CogServer Docker image
      run: |
        cat > Dockerfile.cogserver << 'EOF'
        FROM ubuntu:24.04

        RUN apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates curl libsqlite3-0 librocksdb8.9 libpq5 \
            libevent-2.1-7t64 libevent-pthreads-2.1-7t64 libssl3t64 \
            libgcc-s1 libstdc++6 libgmp10 libyaml-0-2 libpcre2-8-0 libgc1 \
            && rm -rf /var/lib/apt/lists/* \
            && useradd -m -u 10001 cogserver

        WORKDIR /app

        COPY dist/linux-x64/cogserver /app/cogserver

        RUN chmod +x /app/cogserver && ldd /app/cogserver

        USER cogserver

        EXPOSE 18080

        HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
          CMD curl --fail --silent http://localhost:18080/status || exit 1

        ENTRYPOINT ["/app/cogserver"]
        EOF

    - name: Build and push CogServer image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.cogserver
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/cogserver:${{ steps.get_version.outputs.version }}
          ghcr.io/${{ github.repository }}/cogserver:latest

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux-x64, build-linux-arm64, build-macos-x64, build-macos-arm64, build-docker]
    permissions:
      actions: read
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts/

    - name: Wait for main release artifacts
      if: github.event_name == 'push'
      id: main_run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        for attempt in $(seq 1 60); do
          RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=push&head_sha=${GITHUB_SHA}&per_page=100" \
            --jq '.workflow_runs | if length > 0 then sort_by(.created_at)[-1] else empty end')
          if [ -n "$RUN" ]; then
            STATUS=$(jq -r '.status // empty' <<< "$RUN")
            CONCLUSION=$(jq -r '.conclusion // empty' <<< "$RUN")

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" != "success" ]; then
                echo "Main release workflow completed with conclusion: $CONCLUSION" >&2
                exit 1
              fi
              echo "run_id=$(jq -r '.id' <<< "$RUN")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Waiting for main release workflow to complete (attempt $attempt/60)..."
          sleep 30
        done

        echo "Timed out waiting for the main release workflow" >&2
        exit 1

    - name: Download main release artifacts
      if: github.event_name == 'push'
      uses: actions/download-artifact@v4
      with:
        run-id: ${{ steps.main_run.outputs.run_id }}
        github-token: ${{ github.token }}
        path: release-main-artifacts/

    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: List artifacts
      run: |
        echo "Downloaded artifacts:"
        find release-artifacts/ -type f

    - name: Generate release notes
      run: |
        cat > RELEASE_NOTES.md << EOF
        # CrystalCog ${{ steps.get_version.outputs.version }}

        A complete Crystal implementation of the OpenCog AI framework.

        ## What's Included

        This release builds the **21 targets declared in shard.yml** on each platform.
        Each archive includes BUILD-MANIFEST.txt with the exact compiler, architecture, and executable names:

        Executable commands include `crystalcog`, `cogserver`, `cogshell`, `profiler`,
        `nlp`, `pattern_matching`, `pattern_mining`, `distributed_network_demo`,
        `spatial`, `temporal`, and `behavior`.

        The manifest also builds library entry-point artifacts named `cogutil_bin`,
        `atomspace_bin`, `opencog_bin`, `pln_bin`, `ure_bin`, `moses_bin`,
        `attention_bin`, `learning_bin`, `ml_bin`, and `ai_integration_bin`.
        These artifacts are not promised to provide standalone interactive CLIs.

        ## Platform Support

        | Platform | Architecture | Download |
        |----------|-------------|----------|
        | Linux | x86_64 | \`crystalcog-linux-x86_64.tar.gz\` |
        | Linux | ARM64 | \`crystalcog-linux-arm64.tar.gz\` |
        | macOS | x86_64 | \`crystalcog-macos-x86_64.tar.gz\` |
        | macOS | ARM64 (Apple Silicon) | \`crystalcog-macos-arm64.tar.gz\` |

        ## Docker Images

        \`\`\`bash
        # Full CrystalCog
        docker pull ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}

        # CogServer only
        docker pull ghcr.io/${{ github.repository }}/cogserver:${{ steps.get_version.outputs.version }}
        \`\`\`

        ## Quick Start

        \`\`\`bash
        # Download and extract
        tar -xzf crystalcog-linux-x86_64.tar.gz
        cd linux-x64

        # Run CogServer
        ./cogserver

        # In another terminal, test the API
        curl http://localhost:18080/status
        \`\`\`

        ## Verification

        SHA256 checksums are provided for each archive. Verify with:

        \`\`\`bash
        sha256sum -c crystalcog-linux-x86_64.tar.gz.sha256
        \`\`\`

        ## Documentation

        - [README](https://github.com/${{ github.repository }}/blob/main/README.md)
        - [Examples](https://github.com/${{ github.repository }}/tree/main/examples)
        - [API Documentation](https://github.com/${{ github.repository }}/tree/main/docs)

        EOF

    - name: Prepare release files
      run: |
        mkdir -p release-files
        find release-artifacts/ -name "*.tar.gz" -exec cp {} release-files/ \;
        find release-artifacts/ -name "*.sha256" -exec cp {} release-files/ \;
        if [ -d release-main-artifacts ]; then
          find release-main-artifacts/ -name "*.tar.gz" -exec cp {} release-files/ \;
        fi
        ls -lh release-files/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: CrystalCog ${{ steps.get_version.outputs.version }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        files: |
          release-files/*

  # Post-release verification
  verify-release:
    name: Verify Release
    runs-on: ubuntu-latest
    needs: create-release

    steps:
    - name: Verify Docker images
      run: |
        echo "Verifying Docker images..."

        # Get version
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi

        # Pull and test images
        docker pull ghcr.io/${{ github.repository }}:$VERSION
        docker run --rm ghcr.io/${{ github.repository }}:$VERSION --version

        docker pull ghcr.io/${{ github.repository }}/cogserver:$VERSION
        echo "Docker images verified"

    - name: Create release summary
      run: |
        echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Platforms" >> $GITHUB_STEP_SUMMARY
        echo "- Linux x86_64: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Linux ARM64: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- macOS x86_64: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- macOS ARM64: ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
        echo "- crystalcog: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- cogserver: ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Binaries Included" >> $GITHUB_STEP_SUMMARY
        echo "21 declared binaries per platform; inspect BUILD-MANIFEST.txt" >> $GITHUB_STEP_SUMMARY
