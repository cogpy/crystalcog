name: Generate Next Steps Issues

on:
  # Manual only: generate-priority-issues.yml already runs weekly, and both
  # on a schedule would open overlapping issues.
  workflow_dispatch:
    inputs:
      force_recreate:
        description: 'Force recreate all issues (will close existing ones)'
        required: false
        default: 'false'
        type: boolean
      roadmap_file:
        description: 'Roadmap to turn into issues'
        required: false
        default: 'docs/agent-zero/AGENT-ZERO-GENESIS.md'
        type: string

env:
  ROADMAP_FILE: ${{ inputs.roadmap_file || 'docs/agent-zero/AGENT-ZERO-GENESIS.md' }}

# Least-privilege token by default; jobs that write declare their own permissions.
permissions:
  contents: read

# Trace every command so CI logs show exactly what ran and what it printed.
defaults:
  run:
    shell: bash -ex {0}

jobs:
  generate-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Parse roadmap and create issues
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Load the unified roadmap parser module
          const parser = require('./.github/scripts/roadmap-parser.js');
          
          // Parse the roadmap file using the unified parser
          const parsed = parser.parseRoadmapFile(process.env.ROADMAP_FILE);
          
          if (!parsed.success) {
            console.log(`Error parsing roadmap: ${parsed.error}`);
            return;
          }
          
          if (!parsed.metadata.hasNextSteps) {
            console.log('No "Next Development Steps" section found');
            return;
          }
          
          console.log(`Roadmap format: ${parsed.metadata.format}`);
          console.log(`Total sections: ${parsed.stats.totalSections}`);
          console.log(`Total tasks: ${parsed.stats.totalTasks}`);
          console.log(`Incomplete tasks: ${parsed.stats.incompleteTasks}`);
          
          // Convert parsed sections to timeline format for compatibility
          const timelines = parsed.sections.map(section => ({
            number: section.number || 0,
            title: section.title,
            tasks: section.tasks || []
          }));
          
          console.log(`Found ${timelines.length} timeline sections`);
          
          // Get existing issues to avoid duplicates
          const existingIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: 'next-steps',
            state: 'all'
          });
          
          const existingTitles = new Set(existingIssues.data.map(issue => issue.title));
          
          // Force recreate option
          const forceRecreate = context.payload.inputs?.force_recreate === 'true';
          if (forceRecreate) {
            console.log('Force recreate enabled - closing existing next-steps issues');
            for (const issue of existingIssues.data) {
              if (issue.state === 'open') {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }
            existingTitles.clear();
          }
          
          // Create issues for incomplete tasks
          let createdCount = 0;
          let skippedCount = 0;
          
          for (const timeline of timelines) {
            // Use parser module for consistent label generation
            const timelineLabel = parser.generateLabelFromTitle(timeline.title);
            const priority = parser.getPriorityFromSection(timeline.title);
            
            for (const task of timeline.tasks) {
              if (!task.completed) {
                // Use parser module for consistent title generation
                const issueTitle = parser.generateIssueTitle(timeline.title, task.description);
                const contentHash = parser.generateContentHash(timeline.title, task.description);
                const componentTags = parser.getComponentTags(task.description);
                
                if (!existingTitles.has(issueTitle)) {
                  const issueBody = [
                    `## Timeline: ${timeline.title}`,
                    '',
                    'This task is part of the Agent-Zero Genesis development roadmap.',
                    '',
                    '### Task Description',
                    task.description,
                    '',
                    '### Context',
                    `This is a ${timeline.title.toLowerCase()} priority task from the [Agent-Zero Genesis roadmap](${context.payload.repository.html_url}/blob/main/${process.env.ROADMAP_FILE}#next-development-steps).`,
                    `- **Priority**: ${priority}`,
                    `- **Task Format**: ${task.format}`,
                    componentTags.length > 0 ? `- **Components**: ${componentTags.join(', ')}` : '',
                    '',
                    '### Acceptance Criteria',
                    '- [ ] Task implementation completed',
                    '- [ ] Code tested and validated',
                    '- [ ] Documentation updated if needed',
                    '- [ ] Update roadmap checkbox when complete',
                    '',
                    '---',
                    `*This issue was automatically generated from the project roadmap.*`,
                    `*Content Hash: ${contentHash}*`
                  ].filter(line => line !== '').join('\n');

                  try {
                    // Build label set with deduplication
                    const labels = [
                      'next-steps', 
                      timelineLabel, 
                      'roadmap',
                      `priority-${priority}`,
                      ...componentTags
                    ].filter((label, index, arr) => arr.indexOf(label) === index);
                    
                    const issue = await github.rest.issues.create({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      title: issueTitle,
                      body: issueBody,
                      labels: labels
                    });
                    
                    console.log(`✅ Created issue: ${issueTitle}`);
                    createdCount++;
                  } catch (error) {
                    console.error(`❌ Failed to create issue "${issueTitle}": ${error.message}`);
                  }
                } else {
                  console.log(`⏭️ Issue already exists: ${issueTitle}`);
                  skippedCount++;
                }
              }
            }
          }
          
          console.log(`\n📊 Summary:`);
          console.log(`- Found ${timelines.length} timeline sections`);
          console.log(`- Total tasks: ${parsed.stats.totalTasks}`);
          console.log(`- Completed: ${parsed.stats.completedTasks}`);
          console.log(`- Incomplete: ${parsed.stats.incompleteTasks}`);
          console.log(`- Created ${createdCount} new issues`);
          console.log(`- Skipped ${skippedCount} existing issues`);
          
          // Create a summary comment if running manually
          if (context.eventName === 'workflow_dispatch') {
            const summaryLines = [
              '## Next Steps Issues Generation Summary',
              '',
              '**Roadmap Processing:**',
              `- Found ${timelines.length} timeline sections in \`${process.env.ROADMAP_FILE}\``,
              `- Processed ${parsed.stats.totalTasks} total tasks`,
              `- Format detected: ${parsed.metadata.format}`,
              '',
              '**Task Statistics:**',
              `- ✅ Completed tasks: ${parsed.stats.completedTasks}`,
              `- 📋 Incomplete tasks: ${parsed.stats.incompleteTasks}`,
              `- 📝 Format breakdown: checkbox=${parsed.stats.formatBreakdown.checkbox}, checkmark=${parsed.stats.formatBreakdown.checkmark}, plain=${parsed.stats.formatBreakdown.plain}`,
              '',
              '**Issues Created:**',
              `- ✅ Created ${createdCount} new issues`,
              `- ⏭️ Skipped ${skippedCount} existing issues`,
              `- 🔄 Force recreate: ${forceRecreate ? 'Yes' : 'No'}`,
              '',
              '**Timeline Breakdown:**',
              ...timelines.map(t => `- **${t.title}**: ${t.tasks.filter(task => !task.completed).length} pending tasks`),
              '',
              'All new issues have been labeled with:',
              '- `next-steps` (for easy filtering)',
              '- `roadmap` (indicates automatic generation)',
              '- `priority-{high,medium,low}` (based on timeline)',
              '- Timeline-specific labels (e.g., `immediate-week-1-2`, `short-term-month-1`)',
              '- Component-specific labels when applicable',
              '',
              '---',
              `*View all next-steps issues: [Issues with next-steps label](${context.payload.repository.html_url}/issues?q=is%3Aissue+label%3Anext-steps)*`
            ];
            
            const summaryBody = summaryLines.join('\n');

            // Find if there's already a tracking issue
            const trackingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'tracking,next-steps-generation',
              state: 'open'
            });
            
            if (trackingIssues.data.length > 0) {
              // Add comment to existing tracking issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: trackingIssues.data[0].number,
                body: summaryBody
              });
            } else {
              // Create new tracking issue
              const trackingTitle = 'Next Steps Generation Tracking';
              const trackingBody = [
                'This issue tracks the automatic generation of next steps issues from the project roadmap.',
                '',
                summaryBody
              ].join('\n');
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: trackingTitle,
                body: trackingBody,
                labels: ['tracking', 'next-steps-generation']
              });
            }
          }
