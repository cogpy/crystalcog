name: Release and Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  CRYSTAL_VERSION: '1.20.1'

# Trace every command so CI logs show exactly what ran and what it printed.
defaults:
  run:
    shell: bash -ex {0}

jobs:
  # Build release binaries for multiple platforms
  build-release:
    name: Build Release Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
        include:
          - os: ubuntu-24.04
            artifact_name: crystalcog-main-linux-x86_64
            binary_path: crystalcog
          - os: macos-15-intel
            artifact_name: crystalcog-main-macos-x86_64
            binary_path: crystalcog
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev librocksdb-dev libevent-dev libssl-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install sqlite3 rocksdb libevent openssl@3
        echo "LIBRARY_PATH=$(brew --prefix)/lib:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

    - name: Install dependencies
      run: shards install --frozen --production

    - name: Build release binary
      run: |
        echo "Building release binary for ${{ matrix.os }}..."
        crystal build --verbose --stats --release --no-debug src/bin/crystalcog.cr -o ${{ matrix.binary_path }}
        
        # Verify binary
        ls -lh ${{ matrix.binary_path }}
        file ${{ matrix.binary_path }}

    - name: Create tarball
      run: |
        tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.binary_path }} README.md LICENSE

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}.tar.gz
        retention-days: 30

  # Build and push Docker image
  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-release
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download verified Linux release binary
      uses: actions/download-artifact@v4
      with:
        name: crystalcog-main-linux-x86_64
        path: cli-release/

    - name: Create CLI runtime image definition
      run: |
        tar -xzf cli-release/crystalcog-main-linux-x86_64.tar.gz -C cli-release/
        cat > Dockerfile.release-cli << 'EOF'
        FROM ubuntu:24.04
        RUN apt-get update && apt-get install -y --no-install-recommends \
            ca-certificates libsqlite3-0 librocksdb8.9 libpq5 \
            libevent-2.1-7t64 libevent-pthreads-2.1-7t64 libssl3t64 \
            libgcc-s1 libstdc++6 libgmp10 libyaml-0-2 libpcre2-8-0 libgc1 \
            && rm -rf /var/lib/apt/lists/* \
            && useradd -m -u 10001 crystalcog
        COPY cli-release/crystalcog /usr/local/bin/crystalcog
        RUN chmod +x /usr/local/bin/crystalcog && crystalcog --version
        USER crystalcog
        ENTRYPOINT ["crystalcog"]
        EOF

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.release-cli
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/cli:${{ steps.get_version.outputs.version }}
          ghcr.io/${{ github.repository }}/cli:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Publish to package registries
  publish-packages:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: build-release
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Crystal
      uses: crystal-lang/install-crystal@v1
      with:
        crystal: ${{ env.CRYSTAL_VERSION }}

    - name: Publish to Crystal Shards
      run: |
        echo "Package publishing would happen here"
        echo "Note: Crystal doesn't have a central package registry yet"
        echo "Users install via GitHub URL in shard.yml"

  # Deployment notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [build-release, docker-build, publish-packages]
    if: always()
    
    steps:
    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create deployment summary
      run: |
        echo "# CrystalCog Release ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Build Release | ${{ needs.build-release.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Docker Image | ${{ needs.docker-build.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Package Publish | ${{ needs.publish-packages.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Release Links" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
        echo "- [Docker Image](https://ghcr.io/${{ github.repository }}/cli:${{ steps.get_version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
