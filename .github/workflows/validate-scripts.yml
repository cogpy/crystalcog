name: Validate Scripts

on:
  push:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/validate-scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/validate-scripts.yml'
  workflow_dispatch:

jobs:
  validate-demo-profiling-tools:
    name: Validate Demo Profiling Tools Script
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run demo profiling tools validation
        run: |
          chmod +x scripts/validation/validate-demo-profiling-tools.sh
          bash scripts/validation/validate-demo-profiling-tools.sh
