name: Validate Scripts

on:
  push:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'tools/**'
      # Any workflow edit can change a Crystal pin, so re-run the pin guard.
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'tools/**'
      # Any workflow edit can change a Crystal pin, so re-run the pin guard.
      - '.github/workflows/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege token by default; jobs that write declare their own permissions.
permissions:
  contents: read

# Trace every command so CI logs show exactly what ran and what it printed.
defaults:
  run:
    shell: bash -ex {0}

jobs:
  validate-demo-profiling-tools:
    name: Validate Demo Profiling Tools Script
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run demo profiling tools validation
        run: |
          chmod +x scripts/validation/validate-demo-profiling-tools.sh
          bash scripts/validation/validate-demo-profiling-tools.sh

  validate-priority-detector:
    name: Validate Priority Issue Detector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check syntax and failure-evidence regressions
        run: |
          node --check scripts/generate-priority-issues.js
          node --test scripts/generate-priority-issues.test.js

  validate-nightly-required-gates:
    name: Validate Required Nightly Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workflow parser
        run: python3 -m pip install 'PyYAML==6.0.2'

      - name: Check required execution, diagnostics and CogServer outcomes
        run: |
          bash -n scripts/e2e/run_logged.sh scripts/e2e/cogserver_load_test.sh scripts/e2e/test_e2e_harness.sh
          python3 scripts/e2e/test_nightly_workflow_contract.py
          python3 scripts/e2e/test_nightly_required_steps.py
          python3 scripts/e2e/test_crystal_version_pins.py --self-test
          python3 scripts/e2e/test_crystal_version_pins.py
          bash scripts/e2e/test_e2e_harness.sh
