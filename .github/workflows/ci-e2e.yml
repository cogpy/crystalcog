name: CrystalCog E2E CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'spec/**'
      - 'scripts/ci-smoke.sh'
      - 'benchmarks/**'
      - 'shard.yml'
      - 'shard.lock'
      - '.github/workflows/ci-e2e.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run the incoming-index benchmark
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: crystalcog-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CRYSTAL_VERSION: '1.14.0'
  CRYSTAL_WORKERS: '1'

jobs:
  build-and-test:
    name: Locked build and full test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev librocksdb-dev libevent-dev libssl-dev libyaml-dev libpcre2-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/shards
            ~/.cache/crystal
          key: crystal-${{ runner.os }}-${{ env.CRYSTAL_VERSION }}-${{ hashFiles('shard.yml', 'shard.lock') }}
      - name: Install exact locked dependencies
        run: shards install --frozen && shards check
      - name: Validate test-runner failure propagation
        run: bash scripts/validation/test_test_runner_exit.sh
      - name: Build every declared target
        run: shards build --error-trace
      - name: Run full test suite
        run: |
          set -o pipefail
          crystal spec --error-trace --no-color --junit_output=test-results.xml 2>&1 | tee test-output.log
      - name: Exercise compiled CLI and HTTP API
        run: bash scripts/ci-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            test-output.log
            cogserver-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: crystalcog-binaries
          path: bin/

  benchmarks:
    name: Incoming-index performance
    if: github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev librocksdb-dev libevent-dev
      - run: shards install --frozen
      - name: Measure indexed and scan queries
        run: |
          set -o pipefail
          crystal run --release benchmarks/incoming_index_benchmark.cr | tee incoming-benchmark.log
      - uses: actions/upload-artifact@v4
        with:
          name: incoming-benchmark
          path: incoming-benchmark.log
