# This CI job installs Crystal and shard dependencies, then executes `crystal spec` to run the test suite
# More configuration options are available at https://crystal-lang.github.io/install-crystal/configurator.html
#
# Database dependencies can be disabled at compile time using environment variables:
#   DISABLE_SQLITE3=1  - Disable SQLite3 support
#   DISABLE_POSTGRES=1 - Disable PostgreSQL support
#   DISABLE_ROCKSDB=1  - Disable RocksDB support

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 6'  # Every Saturday 6 AM
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-latest
            crystal: "1.20"
          - os: ubuntu-latest
            crystal: nightly
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download source
        uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Cache shards
        uses: actions/cache@v4
        with:
          path: ~/.cache/shards
          key: ${{ runner.os }}-shards-${{ hashFiles('shard.yml') }}
          restore-keys: ${{ runner.os }}-shards-
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev librocksdb-dev libevent-dev libssl-dev libpq-dev
      - name: Set environment for Windows
        if: runner.os == 'Windows'
        run: |
          echo "DISABLE_ROCKSDB=1" >> $GITHUB_ENV
          echo "DISABLE_SQLITE3=1" >> $GITHUB_ENV
          echo "DISABLE_POSTGRES=1" >> $GITHUB_ENV
      - name: Install shards
        run: shards update --ignore-crystal-version
      - name: Run tests
        run: |
          # Run tests with error handling for compiler crashes
          crystal spec --order=random --error-trace --no-color || {
            echo "⚠️  Test run failed, retrying with single-threaded execution..."
            CRYSTAL_WORKERS=1 crystal spec --order=random --error-trace --no-color
          }
