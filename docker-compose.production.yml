services:
  crystalcog:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: runtime
    image: crystalcog/app:production
    restart: unless-stopped
    environment:
      CRYSTALCOG_ENV: production
      PLATFORM_HOST: 0.0.0.0
      PAPHOS_DATA_FILE: /app/data/paphos.json
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE to at least 32 bytes}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 bytes}
      APHRODITE_BACKEND: external
      APHRODITE_URL: ${APHRODITE_URL:?set APHRODITE_URL to an OpenAI-compatible endpoint}
      PLATFORM_MAX_TOKENS: ${PLATFORM_MAX_TOKENS:-160}
    ports:
      - "${GALATEA_PORT:-8080}:8080"
    volumes:
      - crystalcog-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  crystalcog-data:
